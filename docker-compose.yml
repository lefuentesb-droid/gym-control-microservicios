version: '3.8'

services:
  mariadb-db:
    image: mariadb:10.11
    container_name: gym-mariadb-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: db_pago_service_dev
    networks:
      - network-gym
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 20

  eureka-server:
    build: ./eureka-server
    container_name: gym-eureka-server
    ports:
      - "8761:8761"
    networks:
      - network-gym
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    container_name: gym-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - network-gym
    depends_on:
      eureka-server:
        condition: service_healthy

  pago-service:
    build: ./pago-service
    container_name: gym-pago-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DATABASE_HOST: mariadb-db
      GATEWAY_URL: http://localhost:8080
    networks:
      - network-gym
    depends_on:
      mariadb-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  rutina-service:
    build: ./rutina-service
    container_name: gym-rutina-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DATABASE_HOST: mariadb-db
      GATEWAY_URL: http://localhost:8080
    networks:
      - network-gym
    depends_on:
      mariadb-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

networks:
  network-gym:
    driver: bridge
